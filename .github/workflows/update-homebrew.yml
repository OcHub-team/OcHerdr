name: Notify Homebrew tap

on:
  workflow_call:
    inputs:
      tag:
        description: Published OcHerdr release tag
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DISPATCH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Published OcHerdr release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate release and dispatch cask update
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TAP_REPOSITORY: OcHub-team/homebrew-tap
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            printf '%s\n' \
              'HOMEBREW_TAP_DISPATCH_TOKEN is not configured; the tap schedule will discover this release.'
            exit 0
          fi
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          release_json="$(GH_TOKEN="${SOURCE_TOKEN}" gh api "repos/${SOURCE_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -er '.draft' <<<"${release_json}")" = "false"
          test "$(jq -er '.prerelease' <<<"${release_json}")" = "false"
          test "$(jq -er '.tag_name' <<<"${release_json}")" = "${RELEASE_TAG}"

          jq -cn \
            --arg event_type "ocherdr_release_published" \
            --arg tag "${RELEASE_TAG}" \
            '{event_type: $event_type, client_payload: {tag: $tag}}' |
            GH_TOKEN="${TAP_TOKEN}" gh api --method POST \
              "repos/${TAP_REPOSITORY}/dispatches" --input -
