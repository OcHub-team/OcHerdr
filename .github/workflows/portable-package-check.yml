name: Portable package check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: package-check-linux-x64
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: package-check-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Cargo inputs
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: package-check-${{ matrix.target }}
          cache-bin: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libfuse2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1

      - name: Install cargo-packager
        run: cargo binstall cargo-packager --version 0.11.8 --locked --no-confirm

      - name: Build installer and portable archive
        shell: bash
        env:
          OCHERDR_BUILD_TARGET: ${{ matrix.target }}
        run: ./scripts/release/package-portable.sh dist

      - name: Upload package check output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*-setup.exe
            dist/*_linux_*.tar.gz
            dist/*_windows_*.tar.gz
          if-no-files-found: error
          retention-days: 1
