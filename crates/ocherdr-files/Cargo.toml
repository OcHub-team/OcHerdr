[package]
name = "ocherdr-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local and SFTP filesystem backends for OcHerdr"

[dependencies]
futures.workspace = true
ocherdr-core = { path = "../ocherdr-core" }
thiserror.workspace = true
tokio.workspace = true
trash.workspace = true

[target.'cfg(unix)'.dependencies]
openssh.workspace = true
openssh-sftp-client = { workspace = true, features = ["openssh"] }

[target.'cfg(windows)'.dependencies]
openssh-sftp-client.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process"] }
trash = { workspace = true, features = ["coinit_apartmentthreaded"] }

[dev-dependencies]
tempfile.workspace = true
