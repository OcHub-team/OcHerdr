[package]
name = "ocherdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A native cross-platform GUI client for Herdr"

[dependencies]
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
futures.workspace = true
fs2.workspace = true
gpui.workspace = true
gpui-platform.workspace = true
ochub-ui.workspace = true
ocherdr-core = { path = "../ocherdr-core" }
ocherdr-files = { path = "../ocherdr-files" }
ocherdr-herdr = { path = "../ocherdr-herdr" }
ocherdr-terminal = { path = "../ocherdr-terminal" }
parking_lot.workspace = true
minisign-verify.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
tempfile.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[[bin]]
name = "ocherdr"
path = "src/main.rs"

[build-dependencies]
toml = "1.1"

[dev-dependencies]
bincode.workspace = true
gpui = { workspace = true, features = ["test-support"] }
