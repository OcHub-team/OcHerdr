[workspace]
members = [
  "crates/ocherdr-app",
  "crates/ocherdr-core",
  "crates/ocherdr-herdr",
  "crates/ocherdr-terminal",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["OcHub contributors"]
repository = "https://github.com/OcHub-team/OcHerdr"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
dirs = "6"
ochub-ui = { version = "0.6.0", git = "https://github.com/OcHub-team/ochub-ui", tag = "v0.6.0" }
gpui-platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", rev = "a8fafdd7ee36fb3fb98ebbfe5d3be983301d9e74", features = ["font-kit", "runtime_shaders"] }
libc = "0.2"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sys-locale = "0.3"
tempfile = "3"
thiserror = "2"

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }

[profile.release]
lto = "thin"
strip = "symbols"
