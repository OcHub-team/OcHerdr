[workspace]
members = [
  "crates/ocherdr-app",
  "crates/ocherdr-core",
  "crates/ocherdr-files",
  "crates/ocherdr-herdr",
  "crates/ocherdr-terminal",
]
resolver = "2"

[workspace.package]
version = "0.2.8"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
authors = ["OcHub contributors"]
repository = "https://github.com/OcHub-team/OcHerdr"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bincode = { version = "2", features = ["serde"] }
dirs = "6"
futures = "0.3"
fs2 = "0.4"
ochub-ui = { version = "0.6.2", git = "https://github.com/OcHub-team/ochub-ui", rev = "ee186c95951f8cfcfd7b34e37aeced3f7bab6782" }
gpui = { git = "https://github.com/OcHub-team/zed", package = "gpui", rev = "186ff5fc775fb9c807d6bc21b82e78f9d0cbbbe5", version = "=0.2.2" }
gpui-platform = { git = "https://github.com/OcHub-team/zed", package = "gpui_platform", rev = "186ff5fc775fb9c807d6bc21b82e78f9d0cbbbe5", features = ["font-kit", "runtime_shaders"] }
parking_lot = "0.12"
minisign-verify = "0.2.5"
openssh = "0.11.6"
openssh-sftp-client = "0.15.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls-no-alpn"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sys-locale = "0.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
trash = { version = "5.2.6", default-features = false }
url = "2"
uds_windows = "1.2.1"
vt100 = "0.16.2"

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }

# Debug builds must be optimised. At opt-level 0 a GhosttyKit-linked binary
# corrupts the first two fields of freshly grown `HashMap` tables, so
# `RawTable::find` probes forever. It applies to every crate that instantiates
# hashbrown at opt-level 0, this workspace's own crates included, so this
# covers the whole dev profile rather than just dependencies. std ships
# hashbrown with assertions compiled out, so nothing fires; the process spins.
# See docs/known-issues.md.
[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
strip = "symbols"
